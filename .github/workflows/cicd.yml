name: KBOT-CICD

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: make test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        run: |
          make image push TARGETOS=linux TARGETARCH=amd64

  cd:
    name: CD
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          VERSION="$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update helm/values.yaml
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq -i '
              .image.registry = "ghcr.io" |
              .image.repository = "drmoskit/kbot" |
              .image.tag = strenv(VERSION) |
              .image.os = "linux" |
              .image.arch = "amd64"
            ' helm/values.yaml

      - name: Commit updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm/values.yaml
          git diff --cached --quiet && exit 0

          git commit -m "chore: update image to ${VERSION} [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

      - name: Info
        run: |
          echo "ArgoCD відслідковує репозиторій та з auto-sync розгортає нову версію."
